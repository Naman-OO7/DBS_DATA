<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>clock_2</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <main class="flex-col flex items-center justify-center h-screen bg-gradient-to-r from-blue-500 to-purple-500">
        <h1 class="text-2xl">This is my clock!!</h1>
    <h1 class="flex h-20 w-28 items-center bg-green-500 rounded-lg shadow-lg justify-center border 4px solid-red" id="clock">00:00:00</h1>
    <script>
        function clock() {
            
            const now = new Date();

            let hours = String(now.getHours());
            let minutes = String(now.getMinutes());
            let seconds = String(now.getSeconds());

            const currentTime = hours + ":" + minutes + ":" + seconds;     
            document.getElementById("clock").textContent = currentTime;
        }

     
        clock();
        setInterval(clock, 1000);
        
    </script>
    </main>




    
</body>
</html>
